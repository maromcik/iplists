app_log_level: debug
all_log_level: info
#tls_cert_path: <path>/fullchain.pem
#tls_key_path: <path>/privkey.pem
#hostnames:
#   - "localhost:443"
iplist:
   # country_uri: https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.csv.gz
   # asn_uri: https://download.db-ip.com/free/dbip-asn-lite-{year}-{month}.csv.gz
   country_uri: https://download.maxmind.com/geoip/databases/GeoLite2-Country-CSV/download?suffix=zip
   asn_uri: https://download.maxmind.com/geoip/databases/GeoLite2-ASN-CSV/download?suffix=zip
   output_folder: lists
   download_cron: "0 0 * * * *"
   max_age: 24h
   timeout: 10s
   # basic_auth:
      # username: ""
      # password: ""
blocklist:
   ipv4_url: https://blocklist
   ipv6_url: https://blocklist
   ipv4_folder: lists/ipv4
   ipv6_folder: lists/ipv6
   headers:
      Authorization: "Token xxxx"
   timeout: 10s
   download_cron: "0/10 * * * * *"
